/* ============================================================
   状态与逻辑
   ============================================================ */
let currentQ = 0;
const answers = new Array(questions.length).fill(null); // 记录每题选择
let lastResult = null;

/* 验证码校验 */
function checkCode() {
  const input = document.getElementById('codeInput').value.trim();
  if (input === CORRECT_CODE) {
    document.getElementById('codeArea').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    renderQuestion();
  } else {
    alert('验证码错误，请检查后重新输入');
    document.getElementById('codeInput').value = '';
    document.getElementById('codeInput').focus();
  }
}
document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkCode();
});

/* 渲染当前题目 + 导航按钮 */
function renderQuestion() {
  const q = questions[currentQ];
  const selected = answers[currentQ];

  const card = document.getElementById('questionCard');
  card.innerHTML = `
    <div class="question-text">${q.q}</div>
    <div class="options">
      ${q.options.map((opt, oi) => `
        <div class="option ${selected === oi ? 'selected' : ''}" data-o="${oi}" onclick="selectOption(${oi})">
          <span class="option-letter">${'ABCD'[oi]}</span>
          <span>${opt.text}</span>
        </div>
      `).join('')}
    </div>
  `;

  // 进度条
  const pct = ((currentQ + 1) / questions.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    `第 ${currentQ + 1} 题 / 共 ${questions.length} 题`;

  // 导航按钮
  const nav = document.getElementById('navButtons');
  const isFirst = currentQ === 0;
  const isLast = currentQ === questions.length - 1;

  let html = '';
  if (!isFirst) {
    html += `<button class="btn btn-outline btn-half" onclick="prevQuestion()">上一题</button>`;
  }
  if (isLast) {
    html += `<button class="btn btn-gold btn-half" onclick="submitQuiz()">查看结果</button>`;
  } else {
    html += `<button class="btn btn-primary btn-half" onclick="nextQuestion()">下一题</button>`;
  }
  nav.innerHTML = html;
}

/* 选中选项（不自动跳转，等用户点下一题） */
function selectOption(oi) {
  answers[currentQ] = oi;
  document.querySelectorAll('.option').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.o) === oi);
  });
}

/* 上一题 */
function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* 下一题 */
function nextQuestion() {
  if (answers[currentQ] === null) {
    alert('请先选择一个选项再继续哦');
    return;
  }
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* 提交并计算结果 */
function submitQuiz() {
  // 检查是否有未答题
  const unanswered = answers.findIndex(a => a === null);
  if (unanswered !== -1) {
    alert(`还有题目没选哦（第 ${unanswered + 1} 题）`);
    currentQ = unanswered;
    renderQuestion();
    return;
  }

  // 统计得分
  const scores = { jin: 0, mu: 0, shui: 0, huo: 0, tu: 0 };
  answers.forEach((oi, qi) => {
    const s = questions[qi].options[oi].score;
    for (const k in s) scores[k] += s[k];
  });

  // 找最高分
  let maxKey = 'jin', maxVal = -1;
  for (const k in scores) {
    if (scores[k] > maxVal) { maxVal = scores[k]; maxKey = k; }
  }

  // 匹配度百分比
  const total = Object.values(scores).reduce((a, b) => a + b, 0);
  const pct = Math.min(95, Math.round((maxVal / total) * 100 * 2.2));

  const r = results[maxKey];
  lastResult = { ...r, pct };

  // 渲染结果
  const badge = document.getElementById('elBadge');
  badge.textContent = r.name;
  badge.className = 'element-badge ' + r.cls;
  document.getElementById('elName').textContent = r.name + '属性';
  document.getElementById('elPct').textContent = '匹配度 ' + pct + '%';
  document.getElementById('elProfile').textContent = r.profile;
  document.getElementById('elCityType').textContent = r.cityType;
  document.getElementById('elCities').innerHTML =
    r.cities.map(c => `<span class="city-tag">${c}</span>`).join('');
  document.getElementById('elIndustries').innerHTML =
    r.industries.map(i => `<span class="industry-tag">${i}</span>`).join('');
  document.getElementById('elAdvice').textContent = r.advice;

  // 岗位大全按钮文字
  const toggleBtn = document.getElementById('jobsToggleBtn');
  toggleBtn.innerHTML = `查看【${r.name}】适合的具体岗位大全 <span class="arrow">▼</span>`;
  toggleBtn.classList.remove('open');

  // 渲染岗位详情（默认收起）
  const detail = document.getElementById('jobsDetail');
  detail.innerHTML = r.jobs.map(j => `
    <div class="job-item">
      <div class="job-title">${j.title}</div>
      <div class="job-desc">${j.desc}</div>
    </div>
  `).join('');
  detail.classList.remove('show');

  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 展开/收起 具体岗位 */
function toggleJobs() {
  const detail = document.getElementById('jobsDetail');
  const btn = document.getElementById('jobsToggleBtn');
  detail.classList.toggle('show');
  btn.classList.toggle('open');
}

/* 复制结果到剪贴板 */
function copyResult() {
  if (!lastResult) return;
  const r = lastResult;
  const jobsText = r.jobs.map(j => `· ${j.title}：${j.desc}`).join('\n');
  const text =
`【秋招择业五行测试结果】
我的主属性：${r.name}属性（匹配度 ${r.pct}%）

职场性格画像：
${r.profile}

适合城市类型：${r.cityType}
推荐城市：${r.cities.join('、')}

适合行业方向：${r.industries.join('、')}

具体岗位大全：
${jobsText}

秋招择业建议：
${r.advice}

（本测试仅供娱乐参考，不构成任何职业规划建议）`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopyToast('已复制，快去发小红书吧 ✨');
    }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showCopyToast('已复制，快去发小红书吧 ✨');
  } catch (e) {
    showCopyToast('复制失败，请手动长按选择复制');
  }
  document.body.removeChild(ta);
}

function showCopyToast(msg) {
  const el = document.getElementById('copyToast');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 2500);
}

/* 重新测试 */
function resetQuiz() {
  currentQ = 0;
  answers.fill(null);
  lastResult = null;
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('copyToast').textContent = '';
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
